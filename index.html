<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ban-Pick Liên Quân – Gợi ý tướng counter</title>
<meta name="description" content="Mô phỏng ban-pick Liên Quân Mobile: nhập tướng đối thủ và đồng đội, nhận gợi ý tướng khắc chế theo từng đường.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">BP</div>
      <div>
        <h1>BAN-PICK <b>LIÊN QUÂN</b></h1>
        <div class="tag">Gợi ý tướng khắc chế · 10 cấm</div>
      </div>
    </div>
    <button class="turn" id="turn"></button>
    <div class="actions">
      <button class="btn mic" id="mic" title="Ra lệnh bằng giọng nói">🎙️ <span>Giọng nói</span></button>
      <button class="btn" id="undo" title="Hoàn tác">↶ Hoàn tác</button>
      <button class="btn" id="demo">Thử mẫu</button>
      <button class="btn danger" id="reset">Làm lại</button>
    </div>
  </header>

  <div class="vbar" id="vbar" hidden>
    <div class="vbody"><div class="vtxt" id="vtxt"></div><div class="vres" id="vres"></div><div class="vlog" id="vlog"></div><input class="vin" id="vin" placeholder="⌨️ Hoặc gõ lệnh rồi Enter: cấm Tulen · địch chọn Yena · chọn gợi ý số 1" autocomplete="off"></div>
    <button class="vbtn" id="vhelp" title="Câu lệnh mẫu">?</button><button class="vbtn" id="vclose" title="Đóng">✕</button>
  </div>

  <section class="bans">
    <div class="banside ally"><span class="lbl">Đội bạn cấm</span><div class="banrow" id="bans-ally"></div></div>
    <div class="vs">VS</div>
    <div class="banside enemy"><div class="banrow" id="bans-enemy"></div><span class="lbl">Đối thủ cấm</span></div>
  </section>

  <section class="board">
    <div class="team ally">
      <div class="thead">ĐỘI BẠN</div>
      <div id="team-ally"></div>
    </div>

    <div class="center">
      <div class="ctabs">
        <button class="ctab" data-mode="pick" id="tab-pick">Gợi ý pick</button>
        <button class="ctab" data-mode="ban" id="tab-ban">Gợi ý cấm</button>
        <button class="ctab" data-mode="tier" id="tab-tier">Tier meta</button>
        <button class="ctab" data-mode="cong" id="tab-cong">💬 Góp ý</button>
      </div>
      <div class="lanepick" id="lanepick"></div>
      <div id="suggest"></div>
    </div>

    <div class="team enemy">
      <div class="thead">ĐỐI THỦ</div>
      <div id="team-enemy"></div>
    </div>
  </section>

  <section class="intel" id="intel"></section>

  <footer>
    <p id="upd"></p>
    <p class="credit">Agent build by <b>@Trong0322</b></p>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div class="mhead">
      <div class="mtitle" id="mtitle"></div>
      <button class="mclose" id="mclose" aria-label="Đóng">✕</button>
    </div>
    <div class="mtools">
      <div class="mtabs" id="mtabs"></div>
      <input id="msearch" placeholder="Tìm tướng…" autocomplete="off">
      <button class="btn danger" id="mclear" hidden>Xoá ô này</button>
    </div>
    <div class="mswap" id="mswap" hidden>
    </div>
    <div class="mhint" id="mhint"></div>
    <div class="mgrid" id="mgrid"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="community.js"></script>
<script src="voice.js"></script>
</body>
</html>
