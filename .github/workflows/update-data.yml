name: Cập nhật dữ liệu tướng hằng tuần

on:
  schedule:
    - cron: "17 20 * * 0"   # 03:17 sáng thứ Hai giờ Việt Nam
  workflow_dispatch: {}      # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tải dữ liệu nguồn
        run: |
          git clone --depth 1 https://github.com/MLuc24/lien-quan-data /tmp/lqd
          git clone --depth 1 https://github.com/LKTNLAC/Arena-of-Valor-Draft-Suggestion /tmp/aov
          pip install pillow
      - name: Dựng lại data.js và ảnh tướng
        run: python3 tools/build_data.py /tmp/lqd /tmp/aov . data_pro
      - name: Lưu thay đổi (nếu có)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "banpick-bot"
            git config user.email "banpick-bot@users.noreply.github.com"
            git add -A
            git commit -m "Tự cập nhật dữ liệu tướng $(date -u +%F)"
            git push
          else
            echo "Không có gì mới"
          fi
